name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit-tests:
    name: Host unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PlatformIO
        run: pip install --upgrade platformio
      - name: Run native tests
        run: pio test -e native

  firmware:
    name: Firmware build (ESP32-CAM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
      - name: Install PlatformIO
        run: pip install --upgrade platformio
      - name: Use placeholder credentials
        run: cp include/secrets.h.example include/secrets.h
      - name: Build
        run: pio run -e esp32cam
      - name: Check OTA slot size
        run: |
          size=$(stat -c %s .pio/build/esp32cam/firmware.bin)
          echo "firmware.bin: $size bytes (OTA slot: 1310720)"
          test "$size" -le 1310720
      - uses: actions/upload-artifact@v4
        with:
          name: firmware-esp32cam
          path: .pio/build/esp32cam/firmware.bin
