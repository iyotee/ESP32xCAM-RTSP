; ESP32xCAM-RTSP - RTSP (RFC 2326 / RFC 2435) + HTTP MJPEG firmware
; for ESP32 camera boards (AI-Thinker ESP32-CAM).
; https://github.com/iyotee/ESP32xCAM-RTSP
;
;   pio run -e esp32cam                 build the firmware
;   pio test -e native                  run the host unit tests (needs g++ in PATH)

[platformio]
default_envs = esp32cam

[env:esp32cam]
; Pinned: the code targets Arduino-ESP32 3.3.x (ESP-IDF 5.5) shipped with this
; platform release. Do not bump without re-validating the camera and socket APIs.
platform = espressif32@8.0.0
board = esp32cam
framework = arduino
; Must stay identical to the table already on the device: OTA cannot change it.
board_build.partitions = partitions_ota.csv
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
; The framework builder hard-codes CORE_DEBUG_LEVEL=0 (all log_x() compiled
; out): replace it with Info level (3).
build_unflags =
    -DCORE_DEBUG_LEVEL=0
build_flags =
    -DCORE_DEBUG_LEVEL=3
build_src_flags =
    -Wall
    -Wextra
test_ignore = *

[env:native]
platform = native
test_framework = unity
build_flags =
    -std=gnu++17
    -Wall
    -Wextra
    -Wshadow
    -Werror
